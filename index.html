    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif; overflow: hidden; }
    #app { display: flex; width: 100vw; height: 100vh; }
    #sidebar { width: 390px; min-width: 390px; height: 100vh; background: #ffffff; border-right: 1px solid #e0e0e0; display: flex; flex-direction: column; z-index: 1000; box-shadow: 2px 0 12px rgba(0,0,0,0.08); }
    #header { padding: 16px 20px; background: linear-gradient(135deg, #1a73e8, #1557b0); color: white; }
    #header h1 { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
    #header p { font-size: 12px; opacity: 0.92; }
    #controls { padding: 14px 18px; background: #f8f9fa; border-bottom: 1px solid #e0e0e0; display: flex; flex-direction: column; gap: 10px; }
    .control-group { display: flex; flex-direction: column; gap: 4px; }
    .control-group label { font-size: 12px; font-weight: 600; color: #5f6368; }
    .control-group input, .control-group select { padding: 8px 10px; border: 1px solid #dadce0; border-radius: 6px; font-size: 13px; outline: none; background: #fff; }
    .control-group input:focus, .control-group select:focus { border-color: #1a73e8; box-shadow: 0 0 0 2px rgba(26,115,232,0.15); }
    #stats-bar { padding: 9px 18px; font-size: 12px; color: #5f6368; background: #fff; border-bottom: 1px solid #f1f3f4; display: flex; justify-content: space-between; align-items: center; }
    #school-list { flex: 1; overflow-y: auto; padding: 10px 12px; background: #fafafa; }
    .school-card { padding: 12px 14px; border: 1px solid #e8eaed; border-radius: 8px; margin-bottom: 8px; cursor: pointer; transition: all 0.15s; background: white; }
    .school-card:hover { border-color: #1a73e8; box-shadow: 0 2px 8px rgba(26,115,232,0.14); }
    .school-card.active { border-color: #1a73e8; border-width: 2px; background: #e8f0fe; }
    .card-title { font-size: 14px; font-weight: 700; color: #202124; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
    .card-badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 12px; }
    .card-sub { font-size: 12px; color: #5f6368; margin-bottom: 6px; }
    .card-meta { font-size: 11px; color: #5f6368; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .card-actions { margin-top: 8px; display: flex; gap: 6px; }
    .btn-mini { font-size: 11px; padding: 4px 8px; border-radius: 4px; text-decoration: none; font-weight: 600; cursor: pointer; border: 1px solid #dadce0; background: #fff; color: #1a73e8; }
    .btn-mini:hover { background: #e8f0fe; border-color: #1a73e8; }
    .btn-mini.primary { background: #1a73e8; color: #fff; border-color: #1a73e8; }
    .btn-mini.primary:hover { background: #1557b0; }
    #main-view { flex: 1; height: 100vh; position: relative; display: flex; flex-direction: column; }
    #toolbar { height: 46px; background: #ffffff; border-bottom: 1px solid #e0e0e0; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; z-index: 900; }
    .mode-tabs { display: flex; gap: 6px; }
    .tab-btn { padding: 6px 14px; border-radius: 6px; border: 1px solid #dadce0; background: #f8f9fa; font-size: 13px; font-weight: 600; color: #5f6368; cursor: pointer; transition: all 0.15s; }
    .tab-btn.active { background: #1a73e8; color: #ffffff; border-color: #1a73e8; }
    #map-container { flex: 1; width: 100%; height: calc(100vh - 46px); position: relative; }
    #map { width: 100%; height: 100%; background: #e5e3df; }
    #gmap-embed-pane { width: 100%; height: 100%; display: none; flex-direction: column; background: #f1f3f4; }
    #gmap-embed-header { padding: 10px 16px; background: #fff; border-bottom: 1px solid #e0e0e0; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
    #gmap-iframe { flex: 1; width: 100%; border: none; }
    .leaflet-popup-content-wrapper { border-radius: 10px; padding: 4px; }
    .popup-title { font-size: 15px; font-weight: bold; color: #1a73e8; margin-bottom: 8px; }
    .popup-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-bottom: 10px; }
    .popup-table td { padding: 4px 6px; border-bottom: 1px solid #f1f3f4; }
    .popup-table td:first-child { color: #5f6368; width: 34%; font-weight: 600; }
    .popup-btns { display: flex; gap: 6px; }
    .btn-gmap { flex: 1; display: block; text-align: center; background: #1a73e8; color: white !important; text-decoration: none; padding: 7px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; border: none; cursor: pointer; }
    .btn-gmap:hover { background: #1557b0; }
    .btn-gmap.secondary { background: #34a853; }
    .btn-gmap.secondary:hover { background: #2b8b45; }
    .btn-reset { font-size: 12px; color: #1a73e8; background: none; border: none; cursor: pointer; font-weight: 600; }
    .btn-reset:hover { text-decoration: underline; }
    .custom-pin { background: transparent; border: none; }

<body>
  <div id="app">
    <div id="sidebar">
      <div id="header">
        <h1>北區國中佔有率分佈地圖</h1>
        <p>115學年度 (SY2025-2026) 389 所學校定位與業務資料庫</p>
      </div>
      <div id="controls">
        <div class="control-group">
          <label for="search-input">🔍 搜尋學校 / 行政區 / 地址 / 經銷商</label>
          <input type="text" id="search-input" placeholder="例如：板橋國中、大安區、中正路..." />
        </div>
        <div style="display: flex; gap: 8px;">
          <div class="control-group" style="flex: 1;">
            <label for="rep-select">👤 負責業務</label>
            <select id="rep-select"><option value="">全部業務</option></select>
          </div>
          <div class="control-group" style="flex: 1;">
            <label for="city-select">📍 縣市別</label>
            <select id="city-select"><option value="">全部縣市</option></select>
          </div>
          <div class="control-group" style="flex: 1;">
            <label for="dealer-select">🏢 經銷商</label>
            <select id="dealer-select"><option value="">全部經銷商</option></select>
          </div>
        </div>
      </div>
      <div id="stats-bar">
        <span>顯示：<b id="visible-count">0</b> / <span id="total-count">0</span> 校</span>
        <button class="btn-reset" id="btn-reset">重設篩選並縮放全區</button>
      </div>
      <div id="school-list"></div>
    </div>

    <div id="main-view">
      <div id="toolbar">
        <div class="mode-tabs">
          <button class="tab-btn active" id="tab-overview" onclick="switchMode('overview')">🗺️ 全區總覽標記地圖 (389 校)</button>
          <button class="tab-btn" id="tab-embed" onclick="switchMode('embed')">📍 Google Maps 單校實景定位檢視</button>
        </div>
        <div style="font-size: 12px; color: #5f6368;">
          💡 點擊右上角圖層按鈕可切換「Google 標準地圖 / Google 衛星圖 / 內政部國土測繪圖」
        </div>
      </div>
      <div id="map-container">
        <div id="map"></div>
        <div id="gmap-embed-pane">
          <div id="gmap-embed-header">
            <span id="embed-school-title">目前檢視：<b>請從左側點選學校</b></span>
            <a id="embed-external-link" href="https://www.google.com/maps" target="_blank" class="btn-mini primary">↗ 在新分頁開啟完整 Google Maps</a>
          </div>
          <iframe id="gmap-iframe" src="https://maps.google.com/maps?q=25.04,121.55&hl=zh-TW&z=11&output=embed" allowfullscreen loading="lazy"></iframe>
        </div>
      </div>
    </div>
  </div>

3%E5%9C%92%E5%B8%82%E6%A1%83%E5%9C%92%E5%8D%80%E4%B8%AD%E6%AD%A3%E8%B7%AF835%E8%99%9F"}, {"id": "388", "city": "桃園市", "dist": "桃園區", "name": "市立福豐國中", "students": "947", "g7": "476", "g8": "471", "v_114_7": "W", "v_115_7": "K", "v_114_8": "G", "v_115_8": "W", "dealer": "文心", "sales_rep": "林智偉", "addr": "桃園市桃園區延平路326號", "tel": "(03)3669547", "web": "http://www.ffjh.tyc.edu.tw", "lat": 24.975995, "lng": 121.314064, "is_fallback": false, "gmap_url": "https://www.google.com/maps/search/?api=1&query=%E6%A1%83%E5%9C%92%E5%B8%82%E6%A1%83%E5%9C%92%E5%8D%80%E5%B8%82%E7%AB%8B%E7%A6%8F%E8%B1%90%E5%9C%8B%E4%B8%AD%20%E6%A1%83%E5%9C%92%E5%B8%82%E6%A1%83%E5%9C%92%E5%8D%80%E5%BB%B6%E5%B9%B3%E8%B7%AF326%E8%99%9F"}, {"id": "389", "city": "桃園市", "dist": "桃園區", "name": "市立會稽國中", "students": "348", "g7": "161", "g8": "187", "v_114_7": "U", "v_115_7": "U", "v_114_8": "G", "v_115_8": "U", "dealer": "文心", "sales_rep": "林智偉", "addr": "桃園市桃園區大興路222號", "tel": "(03)3551496", "web": "http://www.kjjhs.tyc.edu.tw", "lat": 25.016194, "lng": 121.313962, "is_fallback": false, "gmap_url": "https://www.google.com/maps/search/?api=1&query=%E6%A1%83%E5%9C%92%E5%B8%82%E6%A1%83%E5%9C%92%E5%8D%80%E5%B8%82%E7%AB%8B%E6%9C%83%E7%A8%BD%E5%9C%8B%E4%B8%AD%20%E6%A1%83%E5%9C%92%E5%B8%82%E6%A1%83%E5%9C%92%E5%8D%80%E5%A4%A7%E8%88%88%E8%B7%AF222%E8%99%9F"}];

    const palette = [
      '#e53935', '#1e88e5', '#43a047', '#fb8c00', '#8e24aa',
      '#00acc1', '#3949ab', '#d81b60', '#6d4c41', '#00897b',
      '#7cb342', '#f4511e', '#5e35b1', '#039be5', '#c0ca33'
    ];
    const repColorMap = {};
    const uniqueReps = [...new Set(schoolsData.map(s => s.sales_rep).filter(Boolean))].sort();
    uniqueReps.forEach((r, idx) => {
      repColorMap[r] = palette[idx % palette.length];
    });

    function getRepColor(rep) {
      return repColorMap[rep] || '#546e7a';
    }

    // Populate filter dropdowns
    const repSelect = document.getElementById('rep-select');
    const citySelect = document.getElementById('city-select');
    const dealerSelect = document.getElementById('dealer-select');

    const cities = [...new Set(schoolsData.map(s => s.city).filter(Boolean))];
    const dealers = [...new Set(schoolsData.map(s => s.dealer).filter(Boolean))].sort();

    uniqueReps.forEach(r => {
      const opt = document.createElement('option');
      opt.value = r;
      opt.textContent = r;
      repSelect.appendChild(opt);
    });

    cities.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      citySelect.appendChild(opt);
    });

    dealers.forEach(d => {
      const opt = document.createElement('option');
      opt.value = d;
      opt.textContent = d;
      dealerSelect.appendChild(opt);
    });

    document.getElementById('total-count').textContent = schoolsData.length;

    // Initialize Leaflet Map with multiple reliable tile layers (Google Maps default!)
    const googleStreets = L.tileLayer('https://mt1.google.com/vt/lyrs=m&hl=zh-TW&x={x}&y={y}&z={z}', {
      maxZoom: 20,
      attribution: '© Google Maps'
    });

    const googleHybrid = L.tileLayer('https://mt1.google.com/vt/lyrs=y&hl=zh-TW&x={x}&y={y}&z={z}', {
      maxZoom: 20,
      attribution: '© Google Maps Satellite'
    });

    const nlscEmap = L.tileLayer('https://wmts.nlsc.gov.tw/wmts/EMAP/default/GoogleMapsCompatible/{z}/{y}/{x}', {
      maxZoom: 19,
      attribution: '© 內政部國土測繪中心 臺灣通用電子地圖'
    });

    const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    });

    const map = L.map('map', {
      center: [25.02, 121.52],
      zoom: 11,
      layers: [googleStreets]
    });

    const baseMaps = {
      "Google 標準街道地圖 (推薦)": googleStreets,
      "Google 衛星混合實景圖": googleHybrid,
      "內政部臺灣通用電子地圖": nlscEmap,
      "OpenStreetMap 開放街圖": osmLayer
    };
    L.control.layers(baseMaps, null, { position: 'topright', collapsed: false }).addTo(map);

    const markersLayer = L.layerGroup().addTo(map);
    const markersMap = new Map();
    let currentMode = 'overview';

    function switchMode(mode) {
      currentMode = mode;
      document.getElementById('tab-overview').classList.toggle('active', mode === 'overview');
      document.getElementById('tab-embed').classList.toggle('active', mode === 'embed');
      document.getElementById('map').style.display = mode === 'overview' ? 'block' : 'none';
      document.getElementById('gmap-embed-pane').style.display = mode === 'embed' ? 'flex' : 'none';
      if (mode === 'overview') {
        setTimeout(() => map.invalidateSize(), 50);
      }
    }

    function openInEmbed(schoolId) {
      const s = schoolsData.find(item => item.id === String(schoolId));
      if (!s) return;
      switchMode('embed');
      const query = encodeURIComponent(s.city + s.dist + s.name + ' ' + s.addr);
      document.getElementById('gmap-iframe').src = 'https://maps.google.com/maps?q=' + query + '&hl=zh-TW&z=16&output=embed';
      document.getElementById('embed-school-title').innerHTML = '目前定位：<b>' + s.city + s.dist + ' — ' + s.name + '</b> (' + s.addr + ')';
      document.getElementById('embed-external-link').href = s.gmap_url;
    }

    window.openInEmbed = openInEmbed;
    window.switchMode = switchMode;

    function createMarker(s) {
      const color = getRepColor(s.sales_rep);
      const markerHtml = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="32" height="32" style="filter: drop-shadow(0 2px 3px rgba(0,0,0,0.35));">
        <path fill="${color}" stroke="#ffffff" stroke-width="1.8" d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
      </svg>`;

      const icon = L.divIcon({
        html: markerHtml,
        className: 'custom-pin',
        iconSize: [32, 32],
        iconAnchor: [16, 32],
        popupAnchor: [0, -28]
      });

      const marker = L.marker([s.lat, s.lng], { icon: icon });
      
      const popupHtml = `
        <div style="min-width: 265px;">
          <div class="popup-title">${s.name}</div>
          <table class="popup-table">
            <tr><td>縣市行政區</td><td><b>${s.city} ${s.dist}</b></td></tr>
            <tr><td>學校地址</td><td>${s.addr}</td></tr>
            <tr><td>連絡電話</td><td>${s.tel || '無'}</td></tr>
            <tr><td>負責業務</td><td><b style="color:${color}">${s.sales_rep || '未指派'}</b> (${s.dealer || '自營'})</td></tr>
            <tr><td>學生規模</td><td>總計 <b>${s.students}</b> 人 (7年: ${s.g7} / 8年: ${s.g8})</td></tr>
            <tr><td>7年級版本</td><td>114上: <b>${s.v_114_7}</b> ➔ 115上: <b>${s.v_115_7}</b></td></tr>
            <tr><td>8年級版本</td><td>114上: <b>${s.v_114_8}</b> ➔ 115上: <b>${s.v_115_8}</b></td></tr>
          </table>
          <div class="popup-btns">
            <button class="btn-gmap secondary" onclick="openInEmbed('${s.id}')">🔍 頁面內嵌實景定位</button>
            <a class="btn-gmap" href="${s.gmap_url}" target="_blank">↗ 開啟 Google 地圖導航</a>
          </div>
        </div>
      `;
      marker.bindPopup(popupHtml);
      return marker;
    }

    function render(fitBounds = false) {
      const searchTxt = document.getElementById('search-input').value.trim().toLowerCase();
      const selRep = repSelect.value;
      const selCity = citySelect.value;
      const selDealer = dealerSelect.value;

      markersLayer.clearLayers();
      markersMap.clear();

      const listContainer = document.getElementById('school-list');
      listContainer.innerHTML = '';

      let count = 0;
      const boundsCoords = [];

      schoolsData.forEach(s => {
        const matchSearch = !searchTxt || 
          s.name.toLowerCase().includes(searchTxt) || 
          s.city.toLowerCase().includes(searchTxt) || 
          s.dist.toLowerCase().includes(searchTxt) || 
          s.addr.toLowerCase().includes(searchTxt) ||
          s.dealer.toLowerCase().includes(searchTxt) ||
          s.sales_rep.toLowerCase().includes(searchTxt);
        const matchRep = !selRep || s.sales_rep === selRep;
        const matchCity = !selCity || s.city === selCity;
        const matchDealer = !selDealer || s.dealer === selDealer;

        if (matchSearch && matchRep && matchCity && matchDealer) {
          count++;
          const marker = createMarker(s);
          markersLayer.addLayer(marker);
          markersMap.set(s.id, marker);

          if (s.lat >= 21.5 && s.lat <= 25.6) {
            boundsCoords.push([s.lat, s.lng]);
          }

          const color = getRepColor(s.sales_rep);
          const card = document.createElement('div');
          card.className = 'school-card';
          card.innerHTML = `
            <div class="card-title">
              <span>${s.id}. ${s.name}</span>
              <span class="card-badge" style="background:${color}18; color:${color};">${s.sales_rep || '無'} | ${s.dealer || ''}</span>
            </div>
            <div class="card-sub">📍 ${s.city}${s.dist} — ${s.addr}</div>
            <div class="card-meta">
              <span>👥 學生: <b>${s.students}</b>人</span>
              <span>📘 7年: <b>${s.v_114_7}➔${s.v_115_7}</b></span>
              <span>📗 8年: <b>${s.v_114_8}➔${s.v_115_8}</b></span>
            </div>
            <div class="card-actions">
              <button class="btn-mini" onclick="event.stopPropagation(); focusMarker('${s.id}')">🎯 地圖標記定位</button>
              <button class="btn-mini" onclick="event.stopPropagation(); openInEmbed('${s.id}')">🔍 Google 內嵌實景</button>
              <a class="btn-mini primary" href="${s.gmap_url}" target="_blank" onclick="event.stopPropagation();">↗ Google 導航</a>
            </div>
          `;
          card.addEventListener('click', () => {
            document.querySelectorAll('.school-card').forEach(c => c.classList.remove('active'));
            card.classList.add('active');
            if (currentMode === 'embed') {
              openInEmbed(s.id);
            } else {
              focusMarker(s.id);
            }
          });
          listContainer.appendChild(card);
        }
      });

      document.getElementById('visible-count').textContent = count;

      if (fitBounds && boundsCoords.length > 0 && currentMode === 'overview') {
        map.fitBounds(boundsCoords, { padding: [30, 30], maxZoom: 15 });
      }
    }

    function focusMarker(id) {
      switchMode('overview');
      const s = schoolsData.find(item => item.id === String(id));
      const marker = markersMap.get(String(id));
      if (s && marker) {
        map.setView([s.lat, s.lng], 16);
        marker.openPopup();
      }
    }
    window.focusMarker = focusMarker;

    document.getElementById('search-input').addEventListener('input', () => render(false));
    repSelect.addEventListener('change', () => render(true));
    citySelect.addEventListener('change', () => render(true));
    dealerSelect.addEventListener('change', () => render(true));
    document.getElementById('btn-reset').addEventListener('click', () => {
      document.getElementById('search-input').value = '';
      repSelect.value = '';
      citySelect.value = '';
      dealerSelect.value = '';
      switchMode('overview');
      render(true);
    });

    render(true);
    setTimeout(() => map.invalidateSize(), 200);
  </script>
</body>
</html>
